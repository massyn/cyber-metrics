---
metric_id: im_authentication_mfa
title: Identity Management - Multi-Factor Authentication Coverage
category: Identity Management
type: risk
description: The percentage of user accounts secured with multi-factor
  authentication, a critical metric that quantifies the effectiveness of
  identity protection by reducing the risk of unauthorized access and
  safeguarding sensitive assets, making it vital for minimizing the impact
  of credential-based attacks.
how: |
  Find all active Okta users and their enrolled authentication factors. Users
  are considered compliant if they have at least one active multi-factor
  authentication factor.
slo:
  - 0.9
  - 0.95
weight: 0.5
enabled: true
indicator: false
references:
  CIS 8.1:
    - '6.3'
    - '6.4'
    - '6.5'
  ISO 27001:2022:
    - A.5.17
  NIST CSF v2.0:
    - PR.AA-03
query:
  - |
    SELECT
      users.profile_login AS resource,
      'user' AS resource_type,
      CASE WHEN count(factors.id) > 0 THEN 1 ELSE 0 END AS compliance,
      CASE
        WHEN count(factors.id) = 0 THEN 'No active MFA factor'
        ELSE 'Active MFA factors: ' || string_agg(DISTINCT factors.factor_type, ', ')
      END AS detail
    FROM {{ ref('okta_users') }} AS users
    LEFT JOIN {{ ref('okta_user_factors') }} AS factors
      ON factors.user_id = users.id
      AND factors.status = 'ACTIVE'
    WHERE users.status = 'ACTIVE'
    GROUP BY users.profile_login
