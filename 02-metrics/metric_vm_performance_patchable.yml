---
metric_id: vm_performance_patchable
title: Vulnerabilities not remediated within SLO - patchable
category: Vulnerability Management
type: performance
description: |
  The percentage of systems that were active in the last 30 days
  that have resolved patchable vulnerabilities within the agreed
  Service Level Objective (SLO), providing critical insight into the
  organisation's ability to minimize exposure to known threats and reduce the
  attack surface effectively.
how: |
  Find all active hosts per your vulnerability management system.  Join the
  hosts with the vulnerability database, and filter the vulnerabilities
  on the criteria as defined in the metric definition.
slo:
  - 0.9
  - 0.95
weight: 0
enabled: true
indicator: false
references:
  CIS 8.1:
    - 7.7
  ISO 27001:2022:
    - A.8.8
  NIST CSF v2.0:
    - ID.RA-01
query:
  - |
    SELECT
      host.hostname AS resource,
      'host'    AS resource_type,
      CASE
        WHEN cve.status NOT IN ('open', 'reopen') then 1
        WHEN CURRENT_DATE - CAST(cve.published_on AS DATE) 		< 21 THEN 1
        WHEN CURRENT_DATE - CAST(cve.created_at AS DATE) < 14 THEN 1
        ELSE 0
      END AS compliance,
      'Crowdstrike : ' || cve.cve_id || '(' || cve.severity || ') - ' || coalesce(remediation.title, 'No remediation listed') AS detail
    FROM
      {{ ref('crowdstrike_hosts') }} AS host
    LEFT JOIN
      {{ ref('crowdstrike_vulnerabilities') }} AS cve
      ON host.device_id = cve.agent_id
      AND cve.status IN ('open', 'reopen')
    LEFT JOIN
      {{ ref('crowdstrike_vulnerability_remediations') }} AS remediation
      ON remediation.id = cve.id
    WHERE
      CURRENT_DATE - CAST(host.last_seen AS DATE) < 30 AND
      coalesce(cve.remediation_level = 'O', false) is true
  - |
    SELECT
      cve.asset_hostname as resource,
      'host'    AS resource_type,
      CASE
        WHEN cve.state NOT IN ('OPEN', 'REOPENED') then 1
        WHEN CURRENT_DATE - CAST(cve.publication_date AS DATE) 		< 21 THEN 1
        WHEN CURRENT_DATE - CAST(cve.first_found AS DATE) < 14 THEN 1
        ELSE 0
      END AS compliance,
      'TenableIO : ' || unnest(from_json(cve.cve, '["VARCHAR"]')) || '(' || cve.severity || ') - ' || cve.plugin_name AS detail
    FROM
      {{ ref('tenableio_vulnerabilities') }} AS cve
    WHERE
      CURRENT_DATE - CAST(cve.last_found AS DATE) < 30 AND
      cve.has_patch
