---
metric_id: ns_waf
title: Network Security - External endpoints protected by a WAF
category: Network Security
type: control
description: The metric measures the proportion of external-facing endpoints
  shielded by a Web Application Firewall (WAF), highlighting an organization's
  ability to prevent unauthorized access, mitigate threats like SQL injection
  and cross-site scripting, and safeguard critical systems from cyberattacks,
  making it a key indicator of external-facing application security.
how: |
  Find all DNS records in Cloudflare that can be proxied (A, AAAA and CNAME
  records for web endpoints). Records are considered compliant if they are
  proxied through Cloudflare, which places Cloudflare's WAF in front of the
  endpoint.
slo:
  - 0.9
  - 0.95
weight: 0.5
enabled: true
indicator: false
references:
  CIS 8.1:
    - '13.3'
  ISO 27001:2022:
    - A.8.20
  NIST CSF v2.0:
    - PR.IR-01
query:
  - |
    SELECT
      name || ' (' || type || ')' AS resource,
      'dns_record' AS resource_type,
      CASE WHEN proxied THEN 1 ELSE 0 END AS compliance,
      CASE WHEN proxied THEN 'Proxied through Cloudflare' ELSE type || ' record is DNS only, not proxied through Cloudflare' END AS detail
    FROM {{ ref('cloudflare_dns_records') }}
    WHERE proxiable
