---
metric_id: im_phishing_resistant_mfa
title: Identity Management - Phishing-Resistant MFA Coverage
category: Identity Management
type: risk
description: |
  The percentage of active user accounts with a phishing-resistant
  multi-factor authentication method enrolled, protecting accounts against
  adversary-in-the-middle phishing and push fatigue attacks that defeat
  one-time codes and push notifications.
how: |
  Find all active Okta users and their enrolled authentication factors. Users
  are considered compliant if at least one active factor is phishing-resistant:
  Okta FastPass (signed_nonce) or WebAuthn (security keys, passkeys and platform
  authenticators such as Touch ID or Windows Hello).
slo:
  - 0.8
  - 0.95
weight: 0.5
enabled: true
indicator: false
references:
  "ISO 27001:2022":
    - A.8.5
  "CIS 8.1":
    - 6.3
    - 6.5
  "NIST CSF v2.0":
    - PR.AA-03
  "Essential8":
    - ISM-1682
    - ISM-1872
query:
  - |
    SELECT
      users.profile_login AS resource,
      'user' AS resource_type,
      CASE WHEN count(factors.id) FILTER (WHERE factors.factor_type IN ('signed_nonce', 'webauthn')) > 0 THEN 1 ELSE 0 END AS compliance,
      CASE
        WHEN count(factors.id) = 0 THEN 'No active MFA factor'
        WHEN count(factors.id) FILTER (WHERE factors.factor_type IN ('signed_nonce', 'webauthn')) > 0
          THEN 'Phishing-resistant factor enrolled (' || string_agg(DISTINCT factors.factor_type, ', ') || ')'
        ELSE 'Only phishable factors enrolled (' || string_agg(DISTINCT factors.factor_type, ', ') || ')'
      END AS detail
    FROM {{ ref('okta_users') }} AS users
    LEFT JOIN {{ ref('okta_user_factors') }} AS factors
      ON factors.user_id = users.id
      AND factors.status = 'ACTIVE'
    WHERE users.status = 'ACTIVE'
    GROUP BY users.profile_login
