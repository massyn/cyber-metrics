title: Network Security - External endpoints with insecure ports exposed
category: Network Security
type: risk
description: The "Insecure Ports" metric tracks external endpoints with open
  ports that are improperly configured or vulnerable, highlighting potential
  entry points for cyberattacks, which is critical for reducing the
  organization's exposure to exploitation and ensuring the security of its
  network infrastructure.
how: |
  Find all external-facing endpoints from your external attack surface or
  network scanning tools and check their open ports. Endpoints are considered
  compliant if they expose no insecure ports (e.g. Telnet, FTP, SMB, RDP or
  unencrypted database ports).
