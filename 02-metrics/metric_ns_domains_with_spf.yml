---
metric_id: ns_domains_with_spf
title: Network Security - DNS Domains with SPF configured
category: Network Security
type: risk
description: |
  The percentage of DNS domains with email configured that has an SPF record
  created in the DNS zone.
how: |
  Find all DNS zones in DNSimple and Cloudflare. For every zone with an MX
  record, check that an SPF record has been created. Zones without an MX record
  are assumed not to send email.
slo:
  - 0.95
  - 0.99
weight: 0.5
enabled: true
indicator: false
references:
  "ISO 27001:2022":
    - A.8.20
  "CIS 8.1":
    - 9.2
    - 9.3
    - 12.6
  "NIST CSF v2.0":
    - PR.DS-01
query:
  - |
    SELECT
      zone AS resource,
      'domain' AS resource_type,
      CASE
        WHEN count(*) FILTER (WHERE type = 'MX' AND name = '') = 0 THEN 1
        WHEN count(*) FILTER (WHERE type = 'TXT' AND name = '' AND content ILIKE '%v=spf1%') > 0 THEN 1
        ELSE 0
      END AS compliance,
      CASE
        WHEN count(*) FILTER (WHERE type = 'MX' AND name = '') = 0 THEN 'No MX record found - assumed no email'
        WHEN count(*) FILTER (WHERE type = 'TXT' AND name = '' AND content ILIKE '%v=spf1%') > 0 THEN 'SPF record found'
        ELSE 'MX record found, but no SPF record'
      END AS detail
    FROM {{ ref('dnsimple_zone_records') }}
    GROUP BY zone
  - |
    SELECT
      zones.name AS resource,
      'domain' AS resource_type,
      CASE
        WHEN count(records.id) FILTER (WHERE records.type = 'MX' AND records.name = zones.name) = 0 THEN 1
        WHEN count(records.id) FILTER (WHERE records.type = 'TXT' AND records.name = zones.name AND records.content ILIKE '%v=spf1%') > 0 THEN 1
        ELSE 0
      END AS compliance,
      CASE
        WHEN count(records.id) FILTER (WHERE records.type = 'MX' AND records.name = zones.name) = 0 THEN 'No MX record found - assumed no email'
        WHEN count(records.id) FILTER (WHERE records.type = 'TXT' AND records.name = zones.name AND records.content ILIKE '%v=spf1%') > 0 THEN 'SPF record found'
        ELSE 'MX record found, but no SPF record'
      END AS detail
    FROM {{ ref('cloudflare_zones') }} AS zones
    LEFT JOIN {{ ref('cloudflare_dns_records') }} AS records ON records.zone_id = zones.id
    GROUP BY zones.name
