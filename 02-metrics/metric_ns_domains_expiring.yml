---
metric_id: ns_domains_expiring
title: Network Security - DNS Domains Expiring Within the Next Month
category: Network Security
type: risk
description: |
  The percentage of DNS domains that are set to expire within the next month, which could lead to service disruptions if not renewed in time.
how: |
  Find all domains registered with DNSimple. Domains are considered compliant if
  they are set to auto-renew, or don't expire within the next 30 days.
slo:
  - 0.99
  - 1.00
weight: 0.2
enabled: true
indicator: false
references:
  "ISO 27001:2022":
    - A.8.20
  "CIS 8.1":
    - 9.3
  "NIST CSF v2.0":
    - ID.AM-04
query:
  - |
    SELECT
      name AS resource,
      'domain' AS resource_type,
      CASE WHEN auto_renew OR CAST(expires_on AS DATE) > CURRENT_DATE + 30 THEN 1 ELSE 0 END AS compliance,
      'Expires ' || CAST(CAST(expires_on AS DATE) AS VARCHAR) || CASE WHEN auto_renew THEN ', auto-renew on' ELSE ', auto-renew off' END AS detail
    FROM {{ ref('dnsimple_domains') }}
    WHERE state = 'registered'
